name: Build unsigned iOS IPA

on:
  push:
    branches: [build-ios-ipa]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Check Apple build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          pod --version
      - name: Resolve missing locked dependencies
        run: flutter pub get
      - name: Format source gate fix
        run: dart format lib/local_store.dart test/source_gate_test.dart
      - name: Test source gate reload behavior
        run: flutter test test/source_gate_test.dart --dart-define=ALL_SOURCES=true
      - name: Build unsigned device IPA
        run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
